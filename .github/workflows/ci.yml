name: Hritikpedia CI & Production Build Check

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Unit Tests & Production Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Execute Automated Test Suite (44 Tests)
        run: npm test

      - name: Build Web Platform (Next.js Turbopack)
        run: npm run build:web

      - name: Build Admin Platform (Next.js Turbopack)
        run: npm run build:admin
